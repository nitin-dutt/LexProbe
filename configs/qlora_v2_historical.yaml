# HISTORICAL RECORD — adapter v2 (currently served by the API). NOT runnable with today's code.
#
# Reconstructed on 2026-10-09 from MLflow run a66a1a11eca64afa81844755468757fa
# ("qlora-v2-leak-free-r16-ep1") and the pre-Phase-2 finetune.py (alignment_plan A4).
# The dataset it was trained on (Cycle-2 leak-free split, 772-query test set) no longer exists (A1).
#
# Known problems with this configuration, fixed in qlora_v4.yaml:
#   - max_seq_length 256 cut off the answer in ~67% of positive samples (C1)
#   - context sliced to the first 600 chars of 8,000-char chunks; evaluated/served at 3,000 (B1, C2)
#   - loss on all tokens incl. prompt (C3); duplicate BOS / hand-written template (C4)
#   - no validation during training (C5)

run_name: qlora-v2-leak-free-r16-ep1
output_dir: models/llama-3.1-8b-cuad-lora-v2
model_id: meta-llama/Llama-3.1-8B-Instruct

data:
  dataset: Cycle-2 leak-free split (8,000-char chunks, substring label map) — lost
  max_context_chars: 600        # not logged to MLflow; taken from the code of the time

sequence:
  max_seq_length: 256

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  num_epochs: 1                 # 483 optimizer steps
  learning_rate: 2.0e-4
  per_device_batch_size: 1
  grad_accum: 8
  warmup_steps: 20
  lr_scheduler: cosine
  optimizer: paged_adamw_8bit

results_reported:
  macro_f1: 0.616
  macro_precision: 0.763
  macro_recall: 0.540
  test_queries: 772
  status: retired — not reproducible (A1)
